[project]
name = "pr-reviews"
version = "0.1.0"
description = "List the GitHub pull requests waiting for your review, ranked by size and wait, and show your review karma."
readme = "README.md"
authors = [
    { name = "Mert Alp Taytak", email = "mertalptaytak@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
]

[project.scripts]
pr-reviews = "pr_reviews:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.0.0,<3.0.0",
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.17.0,<0.18.0",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
